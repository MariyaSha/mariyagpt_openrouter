[supervisord]
nodaemon=true
loglevel=info

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/data
user=postgres
autorestart=true
priority=10

[program:backend]
directory=/app/backend
command=uvicorn app:app --host 127.0.0.1 --port 8000
environment=DATABASE_URL="postgresql://mariyagpt:mariyagpt_local@127.0.0.1:5432/mariyagpt",FRONTEND_URL="http://127.0.0.1:5000"
autorestart=true
priority=20

[program:frontend]
directory=/app/frontend
command=gunicorn --bind 0.0.0.0:5000 --timeout 300 app:app
environment=BACKEND_URL="http://127.0.0.1:8000"
autorestart=true
priority=30